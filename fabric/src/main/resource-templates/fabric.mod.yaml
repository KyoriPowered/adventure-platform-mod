schemaVersion: 1
id: "${name.toLowerCase()}"
version: "${version}"
name: "${name}"
authors: [ "kashike","zml", "Luck", "Electroid" ]
contact:
  homepage: "https://github.com/PaperMC/adventure-platform-fabric"
  issues: "https://github.com/PaperMC/adventure-platform-fabric/issues"
  sources: "https://github.com/PaperMC/adventure-platform-fabric"
license: "MIT"
icon: assets/adventure-platform-fabric/logo.png

entrypoints:
  main:
    - "net.kyori.adventure.platform.fabric.impl.AdventureFabricCommon"
    - "net.kyori.adventure.platform.fabric.impl.compat.permissions.PermissionsApiIntegration"
  client:
    - "net.kyori.adventure.platform.fabric.impl.client.AdventureFabricClient"
  adventure-internal:sidedproxy/client:
    - "net.kyori.adventure.platform.modcommon.impl.client.ClientProxy"
  adventure-internal:sidedproxy/server:
    - "net.kyori.adventure.platform.modcommon.impl.server.DedicatedServerProxy"
mixins:
  - "adventure-platform-fabric.accessor.mixins.json"
  - "adventure-platform-fabric.mixins.json"
  - "adventure-platform-mod-shared.accessor.mixins.json"
  - "adventure-platform-mod-shared.mixins.json"
  - { environment: "client", "config": "adventure-platform-fabric.client.mixins.json" }
  - { environment: "client", "config": "adventure-platform-mod-shared.client.mixins.json" }
custom:
  modmenu:api: true
  modmenu:
    badges: [ "library" ]
  loom:injected_interfaces:
    net/minecraft/commands/CommandSourceStack: [ net/kyori/adventure/platform/modcommon/AdventureCommandSourceStack ]
    net/minecraft/world/entity/Entity: [ net/kyori/adventure/sound/Sound<%= '$' %>Emitter, net/kyori/adventure/platform/modcommon/EntityHoverEventSource ]
    # com/mojang/authlib/GameProfile: [ net/kyori/adventure/identity/Identity ] # We can't inject into libs unfortunately
    net/minecraft/server/MinecraftServer: [ net/kyori/adventure/audience/Audience ]
    net/minecraft/world/entity/player/Player: [ net/kyori/adventure/platform/modcommon/IdentifiedAtRuntime ]
    net/minecraft/server/rcon/RconConsoleSource: [ net/kyori/adventure/audience/Audience ]
    net/minecraft/server/level/ServerPlayer: [ net/kyori/adventure/audience/Audience ]
    net/minecraft/client/player/LocalPlayer: [ net/kyori/adventure/audience/Audience ]
    net/minecraft/resources/Identifier: [ net/kyori/adventure/key/Key ]
    net/minecraft/sounds/SoundEvent: [ net/kyori/adventure/sound/Sound<%= '$' %>Type ]
    net/minecraft/resources/ResourceKey: [ net/kyori/adventure/key/Keyed ]
    net/minecraft/world/item/ItemStack: [ "net/kyori/adventure/text/event/HoverEventSource<Lnet/kyori/adventure/text/event/HoverEvent<%= '$' %>ShowItem;>" ] # generic?
    net/minecraft/world/item/ItemStackTemplate: [ "net/kyori/adventure/text/event/HoverEventSource<Lnet/kyori/adventure/text/event/HoverEvent<%= '$' %>ShowItem;>" ] # generic?
    net/minecraft/network/chat/MessageSignature: [ net/kyori/adventure/chat/SignedMessage<%= '$' %>Signature ]

depends:
  minecraft: "~26.2-"
  fabricloader: ">=0.19.2"
  fabric-api-base: "*"
  fabric-command-api-v2: "*"

recommends:
  fabric-networking-api-v1: "*"
